name: E2E Test

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/server/**'
      - '.github/workflows/e2e-test.yaml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/server/**'
      - '.github/workflows/e2e-test.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    name: Run E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build Core Image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./src/server/core
          load: true
          tags: acontext-e2e-test-core:latest
          cache-from: type=gha,scope=e2e-core
          cache-to: type=gha,mode=max,scope=e2e-core

      - name: Build API Image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./src/server/api/go
          load: true
          tags: acontext-e2e-test-api:latest
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api

      - name: Build Admin Image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./src/server/api/go
          file: ./src/server/api/go/Dockerfile.admin
          load: true
          tags: acontext-e2e-test-admin:latest
          cache-from: type=gha,scope=e2e-admin
          cache-to: type=gha,mode=max,scope=e2e-admin

      - name: Run E2E Test
        run: |
          cd src/server
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests

      - name: Collect Container Logs
        if: failure()
        run: |
          cd src/server
          docker compose -f docker-compose.test.yml logs
